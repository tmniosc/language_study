<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học ngôn ngữ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  /* Tông noir như các trang bên dưới, không đổi theo sáng/tối của máy. */
  :root{
    --bg:#050608; --panel:#0C0E11; --panel2:#161B20; --ink:#EDEBE6; --muted:#8B9098; --line:#1E242A;
    --en:#3ED9C9; --zh:#F2B646;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px; margin:0 auto; padding:48px 16px 64px}
  .eyebrow{margin:0 0 10px; color:var(--muted); font:500 11.5px "Google Sans", "Segoe UI", system-ui, sans-serif; letter-spacing:.14em; text-transform:uppercase}
  h1{margin:0 0 14px; font:600 clamp(30px, 5vw, 50px)/1.08 "Google Sans", "Segoe UI", system-ui, -apple-system, sans-serif; letter-spacing:-.015em}
  h1 em{font-style:normal; color:var(--k)}
  .lede{margin:0 0 36px; max-width:760px; color:var(--muted); font-size:16px}
  h2{margin:36px 0 12px; font:500 11px "Google Sans", "Segoe UI", system-ui, sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:1px; background:var(--line); border:1px solid var(--line)}
  a.card{display:block; padding:18px 18px 20px; background:var(--panel); color:inherit; text-decoration:none; transition:background .12s}
  a.card:hover{background:var(--panel2)}
  a.card:focus-visible{outline:2px solid var(--k); outline-offset:-2px}
  .en{--k:var(--en)} .zh{--k:var(--zh)}
  .card .n{display:block; margin-bottom:8px; color:var(--k); font:500 10.5px "Google Sans", "Segoe UI", system-ui, sans-serif; letter-spacing:.12em; text-transform:uppercase}
  .card h3{margin:0 0 4px; font:600 21px/1.2 "Google Sans", "Segoe UI", system-ui, -apple-system, sans-serif; color:var(--k)}
  .card .tag{margin:0 0 10px; color:var(--ink); font-size:13.5px}
  .card p{margin:0; color:var(--muted); font-size:13.5px}
</style>
</head>
<body>
<div class="wrap en">
  <p class="eyebrow">Học ngôn ngữ · <span lang="en">English</span> · <span lang="zh">中文</span></p>
  <h1>Học <em>ngoại ngữ</em> qua cấu trúc câu</h1>
  <p class="lede">Mỗi ngôn ngữ giờ là một site riêng: tiếng Anh, tiếng Trung.</p>

  <h2>Hai site</h2>
  <div class="grid">
    <a class="card en" href="english_study/">
      <span class="n">english_study</span>
      <h3>Tiếng Anh</h3>
      <p>Đồ thị câu, khối từ, luyện nói theo Speaking Matrix.</p>
    </a>
    <a class="card zh" href="xuexi_hanyu/">
      <span class="n">xuexi_hanyu</span>
      <h3>Tiếng Trung</h3>
      <p>Đồ thị câu HSK1–6 và từ vựng, pinyin trên từng chữ.</p>
    </a>
  </div>

</div>
</body>
</html>
