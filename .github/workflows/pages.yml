# Đăng cả repo lên GitHub Pages mỗi lần đẩy lên main. Site là file tĩnh, không có
# bước dựng: chỉ gom file về đúng chỗ, giống hệt đường dẫn serve.py dùng trên máy.
#   index.html          -> /            (mục lục)
#   <site>/src/...      -> /<site>/...  (mọi thư mục con có src/: english_study, xuexi_hanyu…)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gom file vào _site
        run: |
          mkdir _site
          cp index.html _site/
          for src in */src; do
            cp -r "$src" "_site/${src%/src}"
          done
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
